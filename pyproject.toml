[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iharq"
version = "0.3.0"
description = "IHARQ BenchGuard Stretch C cumulative governed repository through finalized P03/L3, ready for P04 intake"
requires-python = ">=3.12,<3.13"
dependencies = [
  "moabb==1.5.0",
  "mne==1.12.1",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "pandas==2.3.1",
  "scikit-learn==1.7.1",
  "h5py==3.14.0",
  "pooch==1.8.2",
  "PyYAML==6.0.2",
  "pydantic==2.11.7",
  "jsonschema==4.25.0",
  "nbformat==5.10.4",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]
p02 = [
  "torch==2.13.0",
  "braindecode==1.6.1",
  "pyriemann==0.12",
  "huggingface-hub==1.24.0",
  "safetensors==0.8.0",
]
full = [
  "pytest==8.4.1",
  "torch==2.13.0",
  "braindecode==1.6.1",
  "pyriemann==0.12",
  "huggingface-hub==1.24.0",
  "safetensors==0.8.0",
]

[project.scripts]
iharq = "iharq.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.iharq]
primary_python = "3.12"
review_mode = "LLM_ONLY"
controlling_build_book = "IHARQ-IBB-R10-P01-L1-INDEPENDENT-AUDIT-REPAIRED"
controlling_annex = "IHARQ-IBB-P01-L1-ANNEX-R4"
official_run_freeze = "P01-L1-OFFICIAL-RUN-FREEZE-R2"
runtime_revision = "R6_ACCEPTED_WITH_P01_FINAL_CLOSURE_R1"

current_phase_status = "PHASE_03_SCOPE_FINALIZED_READY_FOR_P04_INTAKE"
current_phase_handoff = "P03-P04-CANONICAL-HANDOFF-f396048e0f596f7d969e"
