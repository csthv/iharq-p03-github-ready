candidate_claims:
- candidate_claim_id: P02-CLAIM-CAND-001
  claim_text: Under the frozen P01 subject-grouped binary motor-imagery protocol,
    P02 established a complete multi-family raw decoder/baseline measurement spine
    across three public EEG datasets.
  supporting_findings:
  - P02-FIND-001
  supporting_analysis:
  - A0 completion and prediction/checkpoint closure
  scope: Layer-2 measurement infrastructure and evidence
  required_qualification: Raw accept-all decoder evidence only; not clinical or safety
    evidence.
  known_limitations:
  - PUBLIC_EEG_ONLY
  - NO_CALIBRATION_POLICY_CLAIM
  confidence: HIGH
  recommended_manuscript_role: Methods / empirical foundation
  layer0_status: PENDING_REVIEW
  claim_ceiling: SUPPORTED
  layer0_readiness: READY_FOR_REVIEW_NOT_APPROVED
  prohibited_stronger_wording: Do not call P02 calibration-, threshold-, abstention-,
    safety-, or deployment-ready.
- candidate_claim_id: P02-CLAIM-CAND-002
  claim_text: 'Decoder-family performance was dataset-dependent rather than universally
    ordered: DBConformer was descriptively strongest at full training on Lee2019_MI
    and PhysioNetMI, while CSP-LDA led the single-participant BNCI2014_001 test split.'
  supporting_findings:
  - P02-FIND-002
  - P02-FIND-003
  supporting_analysis:
  - A0 participant-first summary
  - A0 statistics
  scope: Full-training A0
  required_qualification: Descriptive rankings; no universal winner; BNCI inferential
    n=1.
  known_limitations:
  - DATASET_HETEROGENEITY
  - BNCI_TEST_PARTICIPANTS_1
  confidence: HIGH_FOR_DESCRIPTION
  recommended_manuscript_role: Main/secondary result
  layer0_status: PENDING_REVIEW
  claim_ceiling: SUPPORTED_WITH_QUALIFICATION
  layer0_readiness: READY_FOR_REVIEW_NOT_APPROVED
  prohibited_stronger_wording: Do not claim one decoder is universally best across
    datasets or participants.
