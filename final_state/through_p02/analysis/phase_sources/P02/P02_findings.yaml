- finding_id: P02-FIND-013
  text: 'Negative evidence is a first-class P02 result: the release preserves 648
    failure/non-success records, 340 NegativeResultNotes and 309 DiagnosticOnlyFlags,
    including branch dependency blocks, conditional skips, input incompatibilities
    and not-applicable repeat slots.'
  evidence:
