analysis_release_id: P02-PHASE-ANALYSIS-FINAL-R2
findings:
- finding_id: P02-FIND-001
  text: 'P02 closed the first governed Layer-2 decoder/baseline measurement spine
    over the frozen P01 data substrate: A0 reached 678/678 terminal cells and preserved
    raw prediction, score, checkpoint, failure, and participant-level evidence.'
  evidence:
  - analysis_inputs/a0_completion.json
  - analysis_inputs/a0_participant_metrics.csv
  datasets:
  - BNCI2014_001
  - Lee2019_MI
  - PhysioNetMI
  models:
  - all P02 A0 branches
  ablations:
  - A0
  metrics:
  - BACC
  - F1_MACRO
  - ACC
  - conditional ROC_AUC
  statistical_support: Execution/evidence closure; performance inference handled in
    later findings.
  scope: Layer-2 raw accept-all measurement spine.
  limitations:
  - Non-clinical; no calibration/threshold/abstention claims.
  proposed_figure_ids: []
  proposed_table_ids: []
- finding_id: P02-FIND-002
  text: Full-training decoder ordering was dataset-dependent. CSP-LDA led BNCI2014_001
    descriptively (BACC 0.639; one held-out participant), whereas DBConformer/DNN-SEQ
    had the highest participant-first mean BACC on Lee2019_MI (0.795) and PhysioNetMI
    (0.650).
  evidence:
  - table_sources/P02_Table_A0_fulltrain_branch_summary.csv
  datasets:
  - BNCI2014_001
  - Lee2019_MI
  - PhysioNetMI
  models:
  - CLS-CSP-LDA
  - DNN-SEQ
  ablations:
  - A0
  metrics:
  - BACC
  statistical_support: Descriptive rankings; BNCI inferential n=1.
  scope: Full-training A0 test evidence.
  limitations:
  - Ranking is descriptive and heterogeneous across datasets.
  proposed_figure_ids:
  - P02_Figure_01_A0_fulltrain_model_by_dataset
  proposed_table_ids:
  - P02_Table_A0_fulltrain_branch_summary
  - P02_Table_A0_secondary_metric_leaders
- finding_id: P02-FIND-003
  text: The governed A0 omnibus test detected model-family heterogeneity on PhysioNetMI
    (Friedman statistic 20.544, p=0.00451, Kendall W=0.267) but not on Lee2019_MI
    (p=0.148); no pairwise alternative-versus-CSP-LDA comparison survived Holm correction
    on Lee2019_MI or PhysioNetMI.
  evidence:
  - analysis_inputs/a0_statistics.json
  datasets:
  - Lee2019_MI
  - PhysioNetMI
  models:
  - eight A0 comparison branches
  ablations:
  - A0
  metrics:
  - BACC
  statistical_support: Friedman omnibus; paired Wilcoxon; Holm; participant unit.
  scope: Governed A0 model comparison.
  limitations:
  - Does not establish a universal winning decoder.
  proposed_figure_ids:
  - P02_Figure_01_A0_fulltrain_model_by_dataset
  proposed_table_ids:
  - P02_Table_A0_fulltrain_branch_summary
- finding_id: P02-FIND-004
  text: 'Participant heterogeneity was substantial in the multi-participant datasets:
    several leading full-training branches spanned near-chance to very high participant
    BACC, so pooled means conceal materially different individual outcomes.'
  evidence:
  - analysis_inputs/subject_profile_metric_source.csv
  - figures/P02_Figure_02_Lee2019_MI_participant_distribution.png
  - figures/P02_Figure_02_PhysioNetMI_participant_distribution.png
  datasets:
  - Lee2019_MI
  - PhysioNetMI
  models:
  - multiple
  ablations:
  - A0
  metrics:
  - BACC
  statistical_support: Participant-first descriptive distributions.
  scope: Participant heterogeneity.
  limitations:
  - P02 does not test a personalization policy.
  proposed_figure_ids:
  - P02_Figure_02_Lee2019_MI_participant_distribution
  - P02_Figure_02_PhysioNetMI_participant_distribution
  proposed_table_ids:
  - P02_Table_A0_participant_first_fulltrain_source
- finding_id: P02-FIND-005
  text: The frozen low-label analysis did not show a smooth universal sample-efficiency
    curve. At 1-32 labels/class most aggregate BACC points remained near chance, model
    ranking changed with budget and dataset, and CSP-LDA at 1/class was explicitly
    non-success on all three datasets.
  evidence:
  - analysis_inputs/low_label_curve_summary.json
  - analysis_inputs/low_label_metric_source.csv
  datasets:
  - BNCI2014_001
  - Lee2019_MI
  - PhysioNetMI
  models:
  - CLS-CSP-LDA
  - RIE-TS-LR
  - DNN-EEGNET
  - SSL-CBRAMOD
  ablations:
  - A0
  metrics:
  - BACC
  statistical_support: Descriptive; exact single frozen subset per budget.
  scope: Low-label A0 surface.
  limitations:
  - One frozen subset; no repeated subset sampling; no interpolation.
  proposed_figure_ids:
  - P02_Figure_03_low_label_BNCI2014_001
  - P02_Figure_03_low_label_Lee2019_MI
  - P02_Figure_03_low_label_PhysioNetMI
  proposed_table_ids:
  - P02_Table_low_label_BACC
  - P02_Table_low_label_budget_deltas
- finding_id: P02-FIND-006
  text: 'Stage 11 required an explicit prospective stopping-rule correction: previously
    sealed EEGNet fits were grandfathered, while only remaining/unsealed fits adopted
    TRUE_P120/FLOOR1. The canonical primary lineage therefore remains mixed (101 P500,
    4 R6 P120/FLOOR500); 15 R7 TRUE_P120/FLOOR1 fits belong to a diagnostic challenger
    and do not replace the primary A0 evidence.'
  evidence:
  - runtime/diagnostics/runtime_successor/stage11_maximum_analysis/stage11_source_centered_recipe.json
  - machine_readable P02 Protocol run matrix
  datasets:
  - BNCI2014_001
  - Lee2019_MI
  - PhysioNetMI
  models:
  - DNN-EEGNET
  ablations:
  - A0
  - diagnostic training-policy challenger
  metrics:
  - BACC
  - F1_MACRO
  statistical_support: Execution provenance / amendment evidence.
  scope: Stage11 historical/canonical identity.
  limitations:
  - Mixed recipe lineage prevents a false all-R7 primary interpretation.
  proposed_figure_ids: []
  proposed_table_ids: []
- finding_id: P02-FIND-007
  text: 'The Stage 11 diagnostic S&R challenger did not provide evidence of a consistent
    test-set advantage over the canonical primary EEGNet: median paired ΔBACC was
    -0.0347 on BNCI2014_001, +0.010 on Lee2019_MI, and 0.000 on PhysioNetMI, with
    Wilcoxon p values 0.125, 0.231 and 0.455 respectively.'
  evidence:
  - analysis_inputs/training_policy_challenger_statistics.json
  datasets:
  - BNCI2014_001
  - Lee2019_MI
  - PhysioNetMI
  models:
  - DNN-EEGNET
  ablations:
  - diagnostic-only; not an A-number
  metrics:
  - BACC
  statistical_support: Participant-paired Wilcoxon and 10,000-resample bootstrap.
  scope: Diagnostic challenger only.
  limitations:
  - Does not rewrite primary A0 or enter A4 selection.
  proposed_figure_ids:
  - P02_Figure_04_training_policy_challenger_effect
  proposed_table_ids:
  - P02_Table_training_policy_challenger_statistics
- finding_id: P02-FIND-008
  text: 'Stage 12 diagnostics demonstrate architecture-specific optimization sensitivity
    rather than a universal training recipe: source/author-centered candidate B removed
    targeted A-collapse for BNCI FBCNet and PhysioNet CBraMod in validation diagnostics,
    but BNCI FBCNet C-confirmation still collapsed in 5/5 confirmation seeds.'
  evidence:
  - runtime/diagnostics/stage12_R6_ABC_author_adaptive_R1/job_summaries/*.json
  datasets:
  - BNCI2014_001
  - PhysioNetMI
  models:
  - DNN-FBCNET
  - DNN-SEQ
  - SSL-CBRAMOD
  ablations:
  - none; diagnostic/amendment evidence
  metrics:
  - validation BACC
  statistical_support: Diagnostic validation-only evidence; test role not loaded.
  scope: Methodological interpretation of Stage12 correction.
  limitations:
  - Claim-bearing test inference comes from canonical A0, not the A/B/C diagnostic
    search.
  proposed_figure_ids: []
  proposed_table_ids: []
- finding_id: P02-FIND-009
  text: 'A4 completed all six governed condition identities across all three datasets,
    but under an explicit resource-constrained single-repeat/deep-anchor deviation:
    1,218 terminal cells comprised 591 SUCCESS, 576 CONDITIONAL_SKIP, 9 INPUT_INCOMPATIBLE
    and 42 NOT_APPLICABLE_REPEAT_SLOT.'
  evidence:
  - analysis_inputs/a4_completion.json
  - analysis_inputs/stage18_resource_constrained_anchor_budget_deviation.json
  datasets:
  - BNCI2014_001
  - Lee2019_MI
  - PhysioNetMI
  models:
  - classical
  - neural
  - Riemannian
  - SSL roles plus C4/C5 ensembles
  ablations:
  - A4
  metrics:
  - BACC
  - burden/delay
  statistical_support: Closure/evidence accounting.
  scope: Resource-constrained canonical Stage18.
  limitations:
  - No five-repeat stability; reduced deep budget grid; not full Build Book equivalence.
  proposed_figure_ids: []
  proposed_table_ids:
  - P02_Table_A4_role_condition_summary
- finding_id: P02-FIND-010
  text: Across the 756 governed C1-C3 role-control statistical rows, no comparison
    reached raw p<=0.05; condition effects were generally small, heterogeneous in
    sign, and dependent on dataset/role/budget.
  evidence:
  - analysis_inputs/a4_role_control_statistics.json
  datasets:
  - BNCI2014_001
  - Lee2019_MI
  - PhysioNetMI
  models:
  - CLASSICAL
  - NEURAL
  - RIEMANNIAN
  - SSL roles
  ablations:
  - A4
  metrics:
  - paired ΔBACC
  statistical_support: Paired Wilcoxon with Holm within the frozen A4 role-control
    family.
  scope: Ordinary A4 C1-C3 controls.
  limitations:
  - Deep roles restricted to anchor budgets/repeat0 in canonical Stage18.
  proposed_figure_ids:
  - P02_Figure_05_A4_role_control_effects
  proposed_table_ids:
  - P02_Table_A4_role_control_statistics
  - P02_Table_A4_role_condition_summary
- finding_id: P02-FIND-011
  text: 'Within the governed C4/C5 ensemble-versus-strongest-constituent family, one
    comparison survived Holm correction: on PhysioNetMI full training at ensemble
    repeat 4, the hard-vote ensemble underperformed validation-selected EEGNet by
    median ΔBACC -0.0435 (raw p=0.0186; Holm p=0.0371; rank-biserial -0.788; 95% bootstrap
    CI -0.1304 to -0.0119).'
  evidence:
  - analysis_inputs/a4_c4_c5_statistics.json
  datasets:
  - PhysioNetMI
  models:
  - A4-C4 hard-vote ensemble
  - DNN-EEGNET constituent
  ablations:
  - A4
  metrics:
  - BACC
  statistical_support: Paired Wilcoxon; Holm; 10,000-resample participant-cluster
    bootstrap.
  scope: One governed C4 comparison identity.
  limitations:
  - Does not imply ensembles are generally inferior across datasets/budgets/repeats.
  proposed_figure_ids: []
  proposed_table_ids:
  - P02_Table_A4_C4_C5_statistics
- finding_id: P02-FIND-012
