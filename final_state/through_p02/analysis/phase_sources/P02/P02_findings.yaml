  - negative_and_failed_results/
  datasets:
  - all
  models:
  - all
  ablations:
  - A0
  - A4
  - diagnostics
  metrics:
  - terminal status / provenance
  statistical_support: Complete terminal-state preservation.
  scope: Failure and negative-result accounting.
  limitations:
  - Counts include governed non-success states that should not be conflated with unexpected
    runtime crashes.
  proposed_figure_ids: []
  proposed_table_ids: []
- finding_id: P02-FIND-014
  text: 'P02 is evidence-sufficient for its governed Layer-2 scope and downstream
    handoff, but its evidence ceiling remains a measurement ceiling: it supports decoder/baseline,
    low-label descriptive, ordinary A4 control and readiness claims, not calibrated
    uncertainty, threshold/abstention policy, clinical safety, temporal robustness,
    stress robustness or embodiment claims.'
  evidence:
  - Protocol v1.0 analysis contract
  - runtime/manifests/stage_artifacts/20_readiness.json
  datasets:
  - all
  models:
  - all
  ablations:
  - A0
  - A4
  metrics:
  - governed P02 metrics
  statistical_support: Protocol claim ceiling + gate closure.
  scope: Downstream readiness.
  limitations:
  - Downstream layers must carry P02 limitations forward.
  proposed_figure_ids: []
  proposed_table_ids: []
