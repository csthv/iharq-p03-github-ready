  blocking: false
  downstream: P02 A4 and Layer 0
  origin_phase: P01
- limitation_id: ACTUAL_RUNTIME_PYTHON_3_12_13_WITH_COMPATIBILITY_AMENDMENT
  scope: Execution environment
  description: Build Book intended Python 3.11, while accepted Kaggle execution used
    Python 3.12.13 under a documented compatibility amendment.
  evidence_consequence: Exact reproduction should use actual captured environment
    or validate equivalence.
  claim_consequence: No scientific claim consequence when science/config remains unchanged.
  blocking: false
  downstream: Reproduction
  origin_phase: P01
- limitation_id: ADAPTIVE_DISK_RESOURCE_AMENDMENT
  scope: Execution resources
  description: Governed amendment P01-L1-KAGGLE-ADAPTIVE-DISK-R1 replaced the legacy
    60 GiB preflight with an adaptive measured requirement with 6.0 GiB effective
    minimum; observed free disk was 18.94 GiB.
  evidence_consequence: Resource policy differs from pre-run intent but was recorded
    and fail-safe.
  claim_consequence: No scientific claim consequence.
  blocking: false
  downstream: Reproduction
  origin_phase: P01
- limitation_id: SOURCE_LICENSE_REDISTRIBUTION_CONSTRAINTS
  scope: Dataset persistence
  description: Source-specific licenses, especially BNCI CC BY-ND, constrain redistribution
    of raw/derived signal bytes.
  evidence_consequence: Bundle carries metadata/hashes/pointers rather than unrestricted
    raw-data redistribution.
  claim_consequence: No performance consequence; affects artifact distribution.
  blocking: false
  downstream: Repository/release packaging
  origin_phase: P01
- limitation_id: BINARY_MI_BRANCH_SCOPE
  scope: P01 task
  description: P01 official supervised denominator is left-hand versus right-hand
    imagery only; rest, feet, tongue, execution, technical and unlabeled online/test
    events are excluded as defined per source.
  evidence_consequence: Results describe the frozen binary task only.
  claim_consequence: No claims about excluded tasks/classes.
  blocking: false
  downstream: P02-P15
  origin_phase: P01
