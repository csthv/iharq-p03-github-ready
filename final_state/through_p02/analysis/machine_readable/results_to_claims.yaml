  - P02
  candidate_claims:
  - CC-07
  limitations:
  - Engineering rejection evidence and scientific negative results are different evidence
    classes and must not be numerically pooled.
  paper_role: Methods, reproducibility and negative-results Discussion.
- result_theme: Reproducibility matured from exact local-snapshot foundation evidence
    in P00, through immutable dataset/split/window identities and execution closure
    in P01, to model/run/checkpoint/prediction provenance and preserved external P02
    workspace/release identities.
  cumulative_finding_id: CF-09
