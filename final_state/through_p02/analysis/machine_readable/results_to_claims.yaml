results_to_claims:
- result_theme: Across P00-P02, IHARQ progressed from validated non-empirical engineering
    contracts to a provenance-locked Layer-1 EEG substrate and then to a governed
    Layer-2 empirical decoder/baseline evidence spine without silently redefining
    phase identities or upstream data contracts.
  cumulative_finding_id: CF-01
  supporting_phase_findings:
  - P00-F-006
  - P00-F-007
  - P01-FIND-014
  - P02-FIND-001
  - P02-FIND-014
  supporting_phases:
  - P00
  - P01
  - P02
  candidate_claims:
  - CC-01
  limitations:
  - Technical/evidence-chain closure is not clinical or deployment validation.
  paper_role: Methods, reproducibility and project architecture.
- result_theme: The P02 empirical results are interpretable against a stable upstream
    substrate because P01 froze a subject-grouped disjoint split, conserved all 12,910
    accepted events into 12,910 valid core windows, and handed those identities forward;
    P02 did not require silent relabeling, rewindowing or denominator substitution.
  cumulative_finding_id: CF-02
  supporting_phase_findings:
  - P01-FIND-002
  - P01-FIND-003
  - P01-FIND-006
  - P01-FIND-014
  - P02-FIND-001
  supporting_phases:
  - P01
  - P02
  candidate_claims:
  - CC-01
  - CC-02
  limitations:
  - The implemented leakage checks are bounded; they do not prove every conceivable
    leakage mechanism impossible.
  paper_role: Methods and validity.
- result_theme: The transition from a three-dataset Layer-1 foundation to P02 decoder
    evaluation exposed dataset-dependent model ordering rather than a universal decoder
    hierarchy; full-training leaders and inferential strength differed materially
    across BNCI2014_001, Lee2019_MI and PhysioNetMI.
  cumulative_finding_id: CF-03
  supporting_phase_findings:
  - P01-FIND-001
  - P02-FIND-002
  - P02-FIND-003
  - P02-FIND-004
  supporting_phases:
  - P01
  - P02
  candidate_claims:
  - CC-03
  limitations:
  - BNCI2014_001 has one held-out P02 test participant; no universal rank claim is
    authorized.
  paper_role: Main Results and Discussion.
- result_theme: 'P01 low-label readiness became an empirical P02 stress test: the
    exact frozen 1/2/4/8/16/32-per-class populations were usable downstream, but P02
    observed near-chance, non-monotonic and rank-changing low-label behavior rather
    than a stable universal sample-efficiency ordering.'
  cumulative_finding_id: CF-04
  supporting_phase_findings:
  - P01-FIND-007
  - P02-FIND-005
  supporting_phases:
  - P01
  - P02
  candidate_claims:
  - CC-04
  limitations:
  - One frozen subset per budget; repeated-subset stability is not established.
  paper_role: Low-label Results and Limitations.
- result_theme: 'A4 evolved in two scientifically distinct steps: P01 discovered that
    the original +4.0 s proposal could not preserve the full parent-event denominator
    and froze a matched +3.5 s R2 substrate; P02 then evaluated the resulting A4 family
    and found no generic statistically detectable C1-C3 improvement under its governed
    resource-constrained scope.'
  cumulative_finding_id: CF-05
  supporting_phase_findings:
  - P01-FIND-009
  - P01-FIND-010
  - P02-FIND-009
  - P02-FIND-010
  supporting_phases:
  - P01
  - P02
  candidate_claims:
  - CC-05
  limitations:
  - P02 canonical A4 uses one refit repeat and deep anchor budgets; absence of detected
    effects is not proof of zero effect.
  paper_role: Ablation Study and Discussion.
- result_theme: The P01-deferred question of whether A4 R2 itself improves decoder
    performance is no longer simply untested after P02; instead it is qualified by
    predominantly null/heterogeneous control evidence, one specific negative hard-vote
    ensemble result, and post-hoc Stage 18S sign sensitivity.
  cumulative_finding_id: CF-06
  supporting_phase_findings:
  - P01-FIND-009
  - P02-FIND-010
  - P02-FIND-011
  - P02-FIND-012
  supporting_phases:
  - P01
  - P02
  candidate_claims:
  - CC-05
  limitations:
  - No five-repeat stability or dense deep-budget response claim; Stage 18S is post-hoc.
  paper_role: Ablation negative-result narrative.
- result_theme: Because P00/P01 stabilized schemas, data identities, splits and windows
    before P02 model execution, the Stage 11/12 correction history is best interpreted
    as a P02-local training/optimization fidelity issue rather than evidence that
    upstream data foundations were invalid.
  cumulative_finding_id: CF-07
  supporting_phase_findings:
  - P00-F-005
  - P01-FIND-003
  - P01-FIND-014
  - P02-FIND-006
  - P02-FIND-008
  supporting_phases:
  - P00
  - P01
  - P02
  candidate_claims:
  - CC-06
  limitations:
  - Stage 12 before/after diagnostics are validation-only and do not establish universal
    test-set improvement.
  paper_role: Reproducibility and methodological Discussion.
- result_theme: 'Fail-closed behavior is a cumulative methodological property rather
    than a single-phase anecdote: P00 rejected malformed fixtures, P01 blocked and
    repaired material stage failures, and P02 preserved failed, skipped, incompatible,
    superseded and diagnostic outcomes alongside successes.'
  cumulative_finding_id: CF-08
  supporting_phase_findings:
  - P00-F-004
