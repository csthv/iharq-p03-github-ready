  limitations:
  - No clinical effectiveness, deployment safety, calibrated decision policy, stress
    robustness or embodiment claim is supported through P02.
  paper_role: Scope and Limitations.
- result_theme: 'Participant and dataset heterogeneity become scientifically visible
    only once the project reaches P02 empirical decoding: upstream integrity enables
    fair measurement, but does not make individual EEG decoding outcomes homogeneous.'
