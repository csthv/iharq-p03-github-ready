- result_theme: 'At the end of P02 the project has a traceable technical continuation
    point for P03: frozen upstream data identities, canonical P02 predictions/checkpoints/failure
    semantics and explicit claim restrictions can be inherited without treating technical
    readiness as downstream scientific success.'
