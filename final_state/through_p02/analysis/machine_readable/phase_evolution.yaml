      deep anchor budgets; five-repeat stability and dense deep-budget characterization
      are not established.
    - The low-label analysis uses one frozen subset per budget rather than repeated
      independent subset sampling; sample-efficiency/stability claims remain qualified.
    - BNCI2014_001 contributes one held-out test participant in the frozen P02 evaluation
      and is therefore descriptive for participant-level inference.
    - Stage 18S is post-hoc descriptive sensitivity evidence and does not modify canonical
      Stage 18/G18 or create confirmatory repeat evidence.
    - P02 covers the governed public EEG datasets/model families and does not establish
      clinical, deployment, calibration, threshold, abstention, safety, or embodiment
      claims.
    - External literature headline numbers are generally methodological/contextual
      references because protocols, datasets, splits, supervision, and metrics differ.
