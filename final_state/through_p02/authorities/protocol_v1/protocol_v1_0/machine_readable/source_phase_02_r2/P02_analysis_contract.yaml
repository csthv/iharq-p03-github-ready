claim_ceiling:
  allowed_candidate_domains:
  - governed raw accept-all baseline decoding measurement
  - model-family comparison under exact frozen protocol
  - low-label behavior under inherited single-subset limitation
  - participant/session heterogeneity as descriptive evidence
  - ordinary A4 controls within explicit resource-constrained scope
  - reproducibility/provenance/downstream technical readiness
  prohibited_as_p02_standalone_claims:
  - clinical efficacy
  - deployment safety
  - calibrated uncertainty
  - threshold/readiness-policy effectiveness
  - selective-risk or abstention effectiveness
  - temporal or stress robustness
  - embodiment effectiveness
  - five-repeat A4 stability
  - dense deep-budget A4 response curve
  - full Build Book A4 replication equivalence
