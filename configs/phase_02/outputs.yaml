    formal owner-compatible representation downstream; no duplicate physical schema
    is invented.
  cardinality: per registered comparison/common-support identity
  consumers: Protocol/L10/L0
  path: analysis_inputs/a4_*common_support* + comparison source tables + downstream
    handoff
