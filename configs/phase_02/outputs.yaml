  cardinality: only when detected
  consumers: all affected claims/consumers
  path: analysis_inputs/split_leakage_validation.json + downstream handoff
- record: MatchedComparisonReport
  status: OWNER_ROUTED_SUPPORT_RECORD; P02_MATCHED_SOURCE_TABLES_COMPLETE
