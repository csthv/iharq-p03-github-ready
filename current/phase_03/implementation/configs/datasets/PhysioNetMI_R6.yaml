  expected_event_inventory:
  - 'T0: rest/no action'
  - 'T1: left-hand imagery in runs 4/8/12'
  - 'T2: right-hand imagery in runs 4/8/12'
  sampling_and_channel_profile:
    eeg_channels: 64
    nominal_sampling_hz: 160
    subject_88_sampling_hz: 128
    format: EDF+
