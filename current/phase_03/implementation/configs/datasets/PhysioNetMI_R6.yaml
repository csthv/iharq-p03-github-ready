  official_reference: https://physionet.org/content/eegmmidb/1.0.0/; https://doi.org/10.13026/C28G6P
  checksum_policy: VERIFY_EACH_DOWNLOADED_FILE_AGAINST_PHYSIONET_SHA256SUMS_TXT_THEN_INDEPENDENTLY_RECOMPUTE_AND_FREEZE_AGGREGATE
