    policy: VALIDATION_SELECTED_UNIFORM_VS_BALANCED_WHEN_TRAIN_COUNTS_UNEQUAL
    record_counts_weights_validation_metrics_and_selected_policy: true
    scope_note: Do not retrofit weighting into classifiers with no native/verified
      class-weight mechanism (e.g. LDA/MDM); apply validation selection only where
      the existing selected classifier/loss supports it without changing algorithm
      family.
    selection:
      primary_metric: BACC
      same_model_seed: true
      same_selected_hyperparameters: true
      same_train_role: true
      same_validation_role: true
      secondary_metric: F1_MACRO
      stage: POST_HYPERPARAMETER_PRE_TEST_TRAINING_POLICY_CHECK
      test_set_access: PROHIBITED
      tie_break: UNIFORM_NO_WEIGHT
    trigger:
      equal_counts_action: UNIFORM_NO_EXTRA_FIT
      type: EXACT_TRAIN_COUNT_EQUALITY_THEN_VALIDATION_POLICY_COMPARISON
      unequal_counts_action: COMPARE_UNIFORM_VS_BALANCED_ON_VALIDATION
    unsupported_branch_action: IF_COUNTS_UNEQUAL_AND_BRANCH_HAS_NO_GOVERNED_CLASS_WEIGHT_SUPPORT_THEN_KEEP_UNWEIGHTED_ONLY_IF_WEIGHTING_IS_NOT_APPLICABLE_TO_THAT_CLASSIFIER;
