    reuse_primary_selected_hyperparameters: true
    run_cell_condition_identity: P02-TRAIN-AUG-SR-EEGNET-FULL-R2-VALIDATION-RESOLVED
    run_cell_count: 15
    run_cell_manifest: p02_training_policy_challenger_run_cells_R2.yaml
    run_cells_frozen: true
    same_five_model_seeds: true
    scope: FULL_TRAIN_ONLY
    seed_derivation: SHA256(namespace|dataset_id|model_seed|model_repeat_index|epoch_index|probability_candidate)_FIRST8_HEX_MOD_2P31_MINUS1_ZERO_TO_ONE
    seed_namespace: IHARQ:P02:L2:EEGNET:SEGMENTATION_RECONSTRUCTION:R2
    segment_count_resolution:
      fixture_fallback: DOCUMENTED_DIVISOR_RULE_ONLY_FOR_NON_SCIENTIFIC_FIXTURE
      pinned_package: braindecode==1.6.1
      requested_n_segments: null
      resolver: SegmentationReconstruction(probability=<candidate>, n_segments=None,
        random_state=<derived>).get_augmentation_params
      test_set_access: NONE
      type: BRAINCDECODE_PUBLIC_API_AUTO_N_SEGMENTS
  class_weighting:
    balanced_formula:
      formula: n_samples / (n_classes * class_count)
      normalization: NONE_BEYOND_SKLEARN_BALANCED_FORMULA
      source_labels: LEGAL_FIT_ROLE_ONLY
      type: SKLEARN_COMPUTE_CLASS_WEIGHT_BALANCED
    conditional_external_branch_rule: IF_COUNTS_UNEQUAL_AND_ADAPTER_DOES_NOT_DECLARE_CLASS_WEIGHT_SUPPORT_THEN_INPUT_INCOMPATIBLE_FAIL_CLOSED
    eligible_branch_rule: ANY_SELECTED_BRANCH_WITH_NATIVE_OR_VERIFIED_CLASS_WEIGHT_SUPPORT
    low_label_equal_per_class_short_circuit: true
    native_supported_branches:
