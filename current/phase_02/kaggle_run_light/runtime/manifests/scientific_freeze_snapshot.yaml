  - batch1_latency_p95
  conditions:
  - condition_id: A4-C0-CORE
    mandatory: REQUIRED
    name: matched CORE A0 reference
    rule: reuse matched A0 CORE predictions
  - condition_id: A4-C1-LONG-3P5S
    mandatory: REQUIRED_WHERE_EXACT_INPUT_SUPPORTED
    name: 3.5-s long window
    rule: refit exact A4_LONG representation; frozen hyperparams/seed; no pad/crop
  - condition_id: A4-C2-MULTI-HARD-VOTE
    mandatory: REQUIRED
    name: three-view hard vote
    rule: V0/V1/V2 view predictions -> deterministic parent-level majority vote
  - condition_id: A4-C3-MULTI-PROB-AVG
    mandatory: CONDITIONALLY_REQUIRED
    name: three-view probability average
    rule: only genuine aligned probabilities; else NOT_APPLICABLE_SCORE_SEMANTICS
  - condition_id: A4-C4-MODEL-HARD-VOTE
    mandatory: REQUIRED_WHEN_CLASSICAL_AND_RIEMANNIAN_REPRESENTATIVES_SUCCESS
    name: fixed ordinary model ensemble hard vote
    rule: pre-result fixed role membership; no learned gating/weights
  - condition_id: A4-C5-MODEL-PROB-AVG
    mandatory: CONDITIONALLY_REQUIRED
    name: fixed ordinary model ensemble probability average
    rule: only genuine aligned probabilities; else NOT_APPLICABLE_SCORE_SEMANTICS
  datasets:
  - PhysioNetMI
  - BNCI2014_001
  - Lee2019_MI
