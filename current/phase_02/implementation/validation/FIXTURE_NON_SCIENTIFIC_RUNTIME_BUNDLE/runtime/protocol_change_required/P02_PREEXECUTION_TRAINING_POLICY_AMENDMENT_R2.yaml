class_weighting:
  policy: VALIDATION_SELECTED_UNIFORM_VS_BALANCED_WHEN_TRAIN_COUNTS_UNEQUAL
  trigger:
    type: EXACT_TRAIN_COUNT_EQUALITY_THEN_VALIDATION_POLICY_COMPARISON
    equal_counts_action: UNIFORM_NO_EXTRA_FIT
    unequal_counts_action: COMPARE_UNIFORM_VS_BALANCED_ON_VALIDATION
  balanced_formula:
    type: SKLEARN_COMPUTE_CLASS_WEIGHT_BALANCED
    formula: n_samples / (n_classes * class_count)
    normalization: NONE_BEYOND_SKLEARN_BALANCED_FORMULA
    source_labels: LEGAL_FIT_ROLE_ONLY
  eligible_branch_rule: ANY_SELECTED_BRANCH_WITH_NATIVE_OR_VERIFIED_CLASS_WEIGHT_SUPPORT
  native_supported_branches:
  - DIAG-LOGVAR
  - CLS-FBCSP-LR
  - RIE-TS-LR
  - RIE-EA-TS
  - DNN-EEGNET
  - DNN-EGTC
  - DNN-SEQ_EEGCONFORMER_FALLBACK
  conditional_external_branch_rule: IF_COUNTS_UNEQUAL_AND_ADAPTER_DOES_NOT_DECLARE_CLASS_WEIGHT_SUPPORT_THEN_INPUT_INCOMPATIBLE_FAIL_CLOSED
  selection:
    stage: POST_HYPERPARAMETER_PRE_TEST_TRAINING_POLICY_CHECK
    same_selected_hyperparameters: true
    same_model_seed: true
    same_train_role: true
    same_validation_role: true
    primary_metric: BACC
    secondary_metric: F1_MACRO
    tie_break: UNIFORM_NO_WEIGHT
    test_set_access: PROHIBITED
  low_label_equal_per_class_short_circuit: true
  record_counts_weights_validation_metrics_and_selected_policy: true
  unsupported_branch_action: IF_COUNTS_UNEQUAL_AND_BRANCH_HAS_NO_GOVERNED_CLASS_WEIGHT_SUPPORT_THEN_KEEP_UNWEIGHTED_ONLY_IF_WEIGHTING_IS_NOT_APPLICABLE_TO_THAT_CLASSIFIER;
    IF_BRANCH_CLAIMS_SUPPORT_BUT_CANNOT_EXECUTE_THEN_FAIL_CLOSED
  scope_note: Do not retrofit weighting into classifiers with no native/verified class-weight
    mechanism (e.g. LDA/MDM); apply validation selection only where the existing selected
    classifier/loss supports it without changing algorithm family.
