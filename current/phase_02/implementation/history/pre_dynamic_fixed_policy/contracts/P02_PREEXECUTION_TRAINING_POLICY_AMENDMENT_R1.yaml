external_method_verification:
  segmentation_reconstruction: Braindecode S&R implements label-preserving segment
    mixing with explicit probability, n_segments, and RNG; cites Lotte 2015.
  augmentation_probability_rationale: Braindecode S&R requires an explicit probability
    but prescribes no universal optimum. P02 freezes 0.5 as a conservative project-specific
    moderate application rate to avoid an additional tuning search; Braindecode official
    EEG augmentation examples demonstrate 0.5 as a conventional stochastic-transform
    probability for other transforms, while comparative EEG literature reports no
    single best augmentation across tasks.
  segment_count_rationale: 4 is the only IHARQ-bounded S&R configuration already technically
    validated; owner authorization promotes it only for this diagnostic P02 challenger.
  class_weighting_rationale: Standard libraries expose weights for imbalanced training
    sets; current frozen P02 counts do not justify changing the baseline loss. Explicit
    no-weight is phase-specific, not a universal threshold.
