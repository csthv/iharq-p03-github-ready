[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iharq"
version = "0.1.0.dev1"
description = "IHARQ BenchGuard Stretch C Phase 0 foundation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic==2.13.4",
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
  "typer==0.26.3",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.scripts]
iharq = "iharq.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.iharq]
primary_python = "3.12"
local_verified_python = "3.13.5"
review_mode = "LLM_ONLY"
